# Dependency policy for pnpm. Registry settings, if any, belong in .npmrc.

# Install only releases that have been public for at least a day.
minimumReleaseAge: 1440

# Each machine may opt into pnpm's global virtual store with
# `pnpm config set --global virtualStoreType global`. Packages there see only the
# dependencies and peers they declare, so link missing peer types next to them,
# and keep NODE_PATH out of bin shims and scripts.
addMissingPeerTypes: true
extendNodePath: false

# Security floors for transitive dependencies.
overrides:
  '@hono/node-server': '^2.1.3'
  'fast-uri': '^3.1.9'
  'hono': '^4.12.24'
  'ip-address': '^10.7.4'
  'path-to-regexp': '^8.4.2'
  'qs': '^6.15.2'
