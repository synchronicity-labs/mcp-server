name: Verify release candidate

on:
  pull_request:
    branches: [main, 'codex/mcp-release-*', 'codex/chatgpt-*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record exact revision
        run: git rev-parse HEAD
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:chatgpt
      - run: npm run verify:chatgpt-package
      - run: npm test -- --no-file-parallelism
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit
      - run: npm audit --omit=dev
      - run: git diff --exit-code
  packaged-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build production image with approved frontend
        run: docker build -t sync-mcp-release-candidate .
      - name: Read packaged UI through MCP in the final image
        run: docker run --rm -i --network none --entrypoint node sync-mcp-release-candidate --input-type=module < scripts/verify-chatgpt-package.mjs
