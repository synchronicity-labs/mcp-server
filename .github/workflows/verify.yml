name: Verify release candidate

on:
  pull_request:
    branches: [main, 'codex/mcp-release-*', 'codex/chatgpt-*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: ./.github/actions/install-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Record exact revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run test:monitor
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:memory
      - run: pnpm run test:memory --burst
      - run: pnpm run package:chatgpt
      - run: pnpm run verify:chatgpt-package
      - run: pnpm run test:memory:http
      - run: pnpm test --no-file-parallelism
      - run: pnpm test
      - run: pnpm run test:browser
      - run: pnpm audit
      - run: pnpm audit --prod
      - run: git diff --exit-code
  packaged-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build production image with approved frontend
        run: docker build -t sync-mcp-release-candidate .
      - name: Read packaged UI through MCP in the final image
        run: docker run --rm -i --network none --entrypoint node sync-mcp-release-candidate --input-type=module - /app/chatgpt-dist --require-image-config < scripts/verify-chatgpt-package.mjs
      - name: Verify HTTP memory recovery in the final image
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD/scripts/verify-http-memory.mjs",target=/app/scripts/verify-http-memory.mjs,readonly
          --entrypoint node sync-mcp-release-candidate
          --expose-gc --max-old-space-size=512 /app/scripts/verify-http-memory.mjs
