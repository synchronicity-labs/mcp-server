name: Publish to npm

# Publishes @sync.so/mcp-server when a merge to main carries a package.json
# version that npm does not have yet. Merges that keep the version do nothing,
# so bump the version in the PR that should ship to npm. Before 1.0, a minor
# bump marks breaking changes or notable features and a patch bump marks fixes.
#
# Authenticates with npm Trusted Publishing (GitHub OIDC), so there is no npm
# token secret. The package's trusted publisher on npmjs.com must name
# synchronicity-labs/mcp-server and this file, publish.yml. Renaming this file
# breaks publishing until that setting is updated.
"on":
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a queued run still publishes its own version.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # write: create the release tag. id-token: npm Trusted Publishing.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 404 means npm has never seen this version; anything else non-200
          # (registry down, rate limit) fails the job instead of guessing.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
            "https://registry.npmjs.org/${name/\//%2f}/$version")
          case "$status" in
            200)
              echo "::notice::$name@$version is already on npm. Nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry returned HTTP $status for $name@$version."
              exit 1
              ;;
          esac

      - name: Install pnpm
        if: steps.version.outputs.publish == 'true'
        uses: ./.github/actions/install-pnpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted Publishing needs npm 11.5.1 or later. Pin it rather than rely on
      # whichever npm the .nvmrc Node release bundles.
      - name: Install npm with Trusted Publishing support
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11.21.1

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run clean
          pnpm run build

      # --ignore-scripts: the build above replaces prepublishOnly, and prepare
      # (husky) has nothing to do in CI. Prereleases go to the "next" tag so
      # they never become "latest".
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --access public --provenance --ignore-scripts --tag "$tag"

      # Tags the published commit and lists the PRs merged since the previous
      # release. A rerun after a failure here skips (npm already has the
      # version), so create a missing release by hand with the same command.
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes "${prerelease[@]}"
