name: MCP EKS deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, production, production-usw1]
        required: true
      source_sha:
        description: Source SHA from the successful MCP EKS image receipt
        required: true
      image_digest:
        description: Immutable multi-platform sha256 digest
        required: true
      manifest_sha:
        description: Reviewed manifest commit on main
        required: true
      routing:
        type: choice
        options: [alb, owner]
        default: alb
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: mcp-eks-${{ inputs.environment == 'dev' && 'dev' || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment == 'dev' && 'eks-dev' || 'eks-production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      MANIFEST_SHA: ${{ inputs.manifest_sha }}
      EKS_ENVIRONMENT: ${{ inputs.environment }}
      ROUTING: ${{ inputs.routing }}
      TEST_HOST: ${{ vars.EKS_TEST_HOSTNAME }}
      WEST_HOST: ${{ vars.EKS_USW1_TEST_HOSTNAME }}
      READINESS: ${{ vars.EKS_READINESS_RECORD }}
      WEST_READINESS: ${{ vars.EKS_USW1_READINESS_RECORD }}
      CERTIFICATE: ${{ vars.EKS_CERTIFICATE_ARN }}
      WEST_CERTIFICATE: ${{ vars.EKS_USW1_CERTIFICATE_ARN }}
      ARGOCD_SERVER: argocd.sync-internal.com
      ARGOCD_OPTS: --grpc-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select reviewed manifests
        run: |
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$MANIFEST_SHA" origin/main
          git checkout --detach "$MANIFEST_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/eks/requirements.txt
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.EKS_READ_ROLE_ARN }}
          aws-region: us-east-1
      - name: Require Product AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 428519446578
      - name: Install verified Argo CLI
        run: |
          version=v3.5.3
          curl --fail --silent --show-error --location "https://github.com/argoproj/argo-cd/releases/download/$version/argocd-linux-amd64" -o "$RUNNER_TEMP/argocd-linux-amd64"
          curl --fail --silent --show-error --location "https://github.com/argoproj/argo-cd/releases/download/$version/cli_checksums.txt" -o "$RUNNER_TEMP/cli_checksums.txt"
          (cd "$RUNNER_TEMP" && grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum --check)
          sudo install -m 555 "$RUNNER_TEMP/argocd-linux-amd64" /usr/local/bin/argocd
      - name: Deploy staging endpoint only
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          : "${ARGOCD_AUTH_TOKEN:?Configure a scoped Argo token}"
          if [ "$EKS_ENVIRONMENT" = production-usw1 ]; then
            TEST_HOST="$WEST_HOST"
            READINESS="$WEST_READINESS"
            CERTIFICATE="$WEST_CERTIFICATE"
          fi
          acceptance=()
          if [ "$EKS_ENVIRONMENT" != dev ]; then
            acceptance=(--acceptance deploy/eks-dev-acceptance.json)
          fi
          python scripts/eks/release.py deploy --environment "$EKS_ENVIRONMENT" \
            --source "$SOURCE_SHA" --digest "$IMAGE_DIGEST" --revision "$MANIFEST_SHA" \
            --host "$TEST_HOST" --readiness "$READINESS" --routing "$ROUTING" --certificate "$CERTIFICATE" \
            --output "$RUNNER_TEMP/mcp-release" "${acceptance[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mcp-eks-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mcp-release/
