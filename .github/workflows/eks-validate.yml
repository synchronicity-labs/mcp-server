name: Validate MCP EKS delivery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  eks-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - run: python -m pip install -r scripts/eks/requirements.txt
      - run: python -m unittest discover -s scripts/eks -p 'test_*.py' -v
      - run: git diff --exit-code
