name: Validate MCP EKS delivery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  eks-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.0
      - run: python -m pip install -r scripts/eks/requirements.txt
      - run: python -m unittest discover -s scripts/eks -p 'test_*.py' -v
      - run: git diff --exit-code
