name: MCP EKS image
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source SHA on main
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: mcp-eks-image
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: eks-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE: 428519446578.dkr.ecr.us-east-1.amazonaws.com/sync-product/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/eks/requirements.txt
      - name: Require protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts/eks python -c 'from release import validate_environment; validate_environment("dev")'
      - name: Validate and check out source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.EKS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Require Product AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 428519446578
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Require immutable registry
        run: |
          aws ecr describe-repositories --repository-names sync-product/mcp-server \
            --query 'repositories[0].imageTagMutability' --output text | grep -x IMMUTABLE
      - name: Build and inspect final runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Retry a partially completed multi-architecture run without overwriting tags.
          aws ecr batch-get-image --repository-name sync-product/mcp-server \
            --image-ids "imageTag=sha-$SOURCE_SHA-$ARCH" > "$RUNNER_TEMP/existing.json"
          if jq -e '.images | length == 1' "$RUNNER_TEMP/existing.json" >/dev/null; then
            docker pull "$IMAGE:sha-$SOURCE_SHA-$ARCH"
            test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:sha-$SOURCE_SHA-$ARCH")" = "$SOURCE_SHA"
            publish=false
          else
            jq -e '.failures | length == 1 and .[0].failureCode == "ImageNotFound"' "$RUNNER_TEMP/existing.json"
            docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "$IMAGE:sha-$SOURCE_SHA-$ARCH" .
            publish=true
          fi
          docker run --rm -i --network none --read-only --user 1000:1000 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --entrypoint node \
            "$IMAGE:sha-$SOURCE_SHA-$ARCH" --input-type=module - /app/chatgpt-dist --require-image-config \
            < scripts/verify-chatgpt-package.mjs
          if [ "$publish" = true ]; then docker push "$IMAGE:sha-$SOURCE_SHA-$ARCH"; fi
  publish:
    needs: build
    environment: eks-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE: 428519446578.dkr.ecr.us-east-1.amazonaws.com/sync-product/mcp-server
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.EKS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Require Product AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 428519446578
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish index and receipt
        run: |
          docker buildx imagetools create -t "$IMAGE:sha-$SOURCE_SHA" \
            "$IMAGE:sha-$SOURCE_SHA-amd64" "$IMAGE:sha-$SOURCE_SHA-arm64"
          digest=$(aws ecr describe-images --repository-name sync-product/mcp-server \
            --image-ids "imageTag=sha-$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          jq -n --arg source "$SOURCE_SHA" --arg image "$IMAGE@$digest" \
            '{source_sha:$source,image:$image}' > image-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-eks-image-${{ inputs.source_sha }}
          path: image-receipt.json
